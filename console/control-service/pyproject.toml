[project]
name = "strix-console-service"
version = "0.1.1"
description = "Loopback-only control service for Strix Console"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.140.0",
  "reportlab>=4.0,<6",
  "uvicorn==0.51.0",
]

[project.scripts]
strix-console-service = "strix_console_service.main:main"

[dependency-groups]
dev = [
  "httpx2>=2.9.1,<3",
  "mypy>=1.16,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "types-reportlab>=4.4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strix_console_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]
"src/strix_console_service/system_checks.py" = ["S603"]

[tool.ruff.lint.isort]
known-first-party = ["strix_console_service"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["strix_console_service"]
