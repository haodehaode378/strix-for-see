[package]
name = "strix-console"
version = "0.1.10"
description = "Local control and observability console for Strix"
authors = ["Strix Console contributors"]
edition = "2024"

[lib]
name = "strix_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
rand = "=0.9.2"
serde_json = "=1.0.150"
tauri = { version = "=2.11.2", features = ["tray-icon"] }
tauri-plugin-updater = "=2.10.1"
