name: Console Checks

on:
  push:
    paths:
      - "console/**"
      - ".github/workflows/console-checks.yml"
  pull_request:
    paths:
      - "console/**"
      - ".github/workflows/console-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Install frontend dependencies
        working-directory: console
        run: npm ci

      - name: Check frontend
        working-directory: console
        run: npm run check

      - name: Install control-service dependencies
        working-directory: console/control-service
        run: uv sync --frozen

      - name: Check control service
        working-directory: console/control-service
        run: |
          uv run ruff check .
          uv run mypy
          uv run pytest

      - name: Check desktop shell
        working-directory: console
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
