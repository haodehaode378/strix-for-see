name: Console Checks

on:
  push:
    paths:
      - "console/**"
      - ".github/workflows/console-checks.yml"
  pull_request:
    paths:
      - "console/**"
      - ".github/workflows/console-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Install frontend dependencies
        working-directory: console
        run: npm ci

      - name: Check frontend
        working-directory: console
        run: npm run check

      - name: Install control-service dependencies
        working-directory: console/control-service
        run: uv sync --frozen

      - name: Check control service
        working-directory: console/control-service
        run: |
          uv run ruff check .
          uv run mypy
          uv run pytest

      - name: Check desktop shell
        working-directory: console
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
