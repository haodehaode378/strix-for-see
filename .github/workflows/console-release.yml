name: Console Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Sandbox version
        id: sandbox
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < containers/SANDBOX_VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "Invalid Sandbox version: $version"; exit 1; }
          grep -Fq "_SANDBOX_VERSION = \"$version\"" \
            console/control-service/src/strix_console_service/updates.py ||
            { echo "Sandbox version does not match the update service"; exit 1; }
          grep -Fq "strix-sandbox:$version" \
            console/control-service/src/strix_console_service/system_checks.py ||
            { echo "Sandbox version does not match environment checks"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/strix-for-see-sandbox" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push Sandbox
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          build-args: SANDBOX_VERSION=${{ steps.sandbox.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.strix.sandbox.version=${{ steps.sandbox.outputs.version }}
          tags: |
            ${{ steps.sandbox.outputs.image }}:${{ steps.sandbox.outputs.version }}
            ${{ steps.sandbox.outputs.image }}:latest

      - name: Create Sandbox compatibility manifest
        shell: bash
        env:
          IMAGE: ${{ steps.sandbox.outputs.image }}
          VERSION: ${{ steps.sandbox.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > sandbox-image.json
          size_bytes="$(jq '[.layers[].size] | add' sandbox-image.json)"
          app_version="$(jq -r '.version' console/src-tauri/tauri.conf.json)"
          test "$size_bytes" -gt 0
          jq -n \
            --arg version "$VERSION" \
            --arg image "$IMAGE:$VERSION" \
            --arg digest "$DIGEST" \
            --arg appVersion "$app_version" \
            --argjson sizeBytes "$size_bytes" \
            '{
              version: $version,
              image: $image,
              digest: $digest,
              sizeBytes: $sizeBytes,
              minimumAppVersion: $appVersion,
              maximumAppVersion: $appVersion
            }' > sandbox.json

      - name: Create offline Sandbox package
        shell: bash
        env:
          IMAGE: ${{ steps.sandbox.outputs.image }}
          VERSION: ${{ steps.sandbox.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          runtime_image="ghcr.io/usestrix/strix-sandbox:$VERSION"
          archive="strix-sandbox-$VERSION-amd64.tar.gz"
          docker pull "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" "$runtime_image"
          docker save "$runtime_image" | gzip -1 > "$archive"
          test "$(stat -c%s "$archive")" -gt 0
          test "$(stat -c%s "$archive")" -lt 2000000000 || {
            echo "Offline Sandbox package exceeds the GitHub Release asset limit"
            exit 1
          }
          cp scripts/install-sandbox-offline.ps1 install-sandbox-offline.ps1
          pwsh -NoProfile -File ./install-sandbox-offline.ps1 "$archive" "$VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandbox-manifest
          path: |
            sandbox.json
            strix-sandbox-*-amd64.tar.gz
            install-sandbox-offline.ps1
          if-no-files-found: error
          compression-level: 0

  build:
    needs: sandbox
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.24.x"
          cache-dependency-path: strix/interface/tui/go.sum

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Verify release version
        shell: pwsh
        run: |
          $config = Get-Content console/src-tauri/tauri.conf.json | ConvertFrom-Json
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tagVersion = "${{ github.ref_name }}".TrimStart("v")
            if ($config.version -ne $tagVersion) {
              throw "Tag version $tagVersion does not match Tauri version $($config.version)"
            }
          }

      - name: Build bundled Strix and control service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          uv sync --frozen
          New-Item -ItemType Directory -Force build/sidecar | Out-Null
          Push-Location strix/interface/tui
          try {
            $env:CGO_ENABLED = "0"
            go build -trimpath -ldflags="-s -w" `
              -o ../../../build/sidecar/strix-tui.exe ./cmd/strix-tui
          } finally {
            Pop-Location
          }
          uv run pyinstaller strix.spec --noconfirm
          uv run --project console/control-service --with pyinstaller pyinstaller `
            --noconfirm --onefile --name strix-console-service `
            --paths console/control-service/src `
            console/control-service/src/strix_console_service/main.py
          New-Item -ItemType Directory -Force console/src-tauri/binaries | Out-Null
          Copy-Item dist/strix.exe `
            console/src-tauri/binaries/strix-x86_64-pc-windows-msvc.exe
          Copy-Item dist/strix-console-service.exe `
            console/src-tauri/binaries/strix-console-service-x86_64-pc-windows-msvc.exe

      - name: Create signed updater release configuration
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          if (-not $env:TAURI_UPDATER_PUBLIC_KEY) {
            throw "TAURI_UPDATER_PUBLIC_KEY is required"
          }
          $releaseConfig = @{
            bundle = @{
              externalBin = @(
                "binaries/strix-console-service",
                "binaries/strix"
              )
            }
            plugins = @{
              updater = @{
                pubkey = $env:TAURI_UPDATER_PUBLIC_KEY
                endpoints = @(
                  "https://github.com/haodehaode378/strix-for-see/releases/latest/download/latest.json"
                )
                windows = @{ installMode = "passive" }
              }
            }
          }
          $releaseConfig | ConvertTo-Json -Depth 8 |
            Set-Content -Encoding utf8 console/src-tauri/tauri.release.conf.json

      - name: Build NSIS installer and signed updater artifact
        working-directory: console
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npm run tauri build -- --config src-tauri/tauri.release.conf.json

      - name: Create updater manifest
        shell: pwsh
        run: |
          $bundle = Get-ChildItem console/src-tauri/target/release/bundle/nsis/*-setup.exe |
            Select-Object -First 1
          $signature = Get-Content "$($bundle.FullName).sig" -Raw
          $config = Get-Content console/src-tauri/tauri.conf.json | ConvertFrom-Json
          $version = $config.version
          $assetName = [uri]::EscapeDataString($bundle.Name)
          $downloadUrl = "https://github.com/haodehaode378/strix-for-see/releases/download/v$version/$assetName"
          $manifest = @{
            version = $version
            notes = "See the GitHub release notes."
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                url = $downloadUrl
                signature = $signature.Trim()
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 |
            Set-Content -Encoding utf8 console/src-tauri/target/release/bundle/nsis/latest.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sandbox-manifest
          path: console/src-tauri/target/release/bundle/nsis

      - name: Smoke test Windows installer
        shell: pwsh
        run: |
          $bundle = Get-ChildItem console/src-tauri/target/release/bundle/nsis/*-setup.exe |
            Select-Object -First 1
          if (-not $bundle) {
            throw "NSIS installer was not generated"
          }

          $install = Start-Process -FilePath $bundle.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($install.ExitCode)"
          }

          $uninstallRoots = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty $uninstallRoots -ErrorAction SilentlyContinue |
            Where-Object DisplayName -eq "Strix Console" |
            Select-Object -First 1
          if (-not $entry -or -not $entry.InstallLocation) {
            throw "Installed Strix Console entry was not found"
          }

          $installLocation = $entry.InstallLocation.Trim().Trim('"')
          if (-not (Test-Path -LiteralPath $installLocation -PathType Container)) {
            throw "Installed Strix Console directory was not found"
          }
          $executables = Get-ChildItem -LiteralPath $installLocation -Filter *.exe -Recurse
          $app = $executables |
            Where-Object Name -In @("strix-console.exe", "Strix Console.exe") |
            Select-Object -First 1
          $service = $executables |
            Where-Object Name -eq "strix-console-service.exe" |
            Select-Object -First 1
          $strix = $executables | Where-Object Name -eq "strix.exe" | Select-Object -First 1
          if (-not $app -or -not $service -or -not $strix) {
            throw "Installed application or bundled sidecars are missing"
          }

          try {
            $appProcess = Start-Process -FilePath $app.FullName -PassThru
            $listener = $null
            for ($attempt = 0; $attempt -lt 30 -and -not $listener; $attempt++) {
              Start-Sleep -Seconds 1
              if ($appProcess.HasExited) {
                throw "Strix Console exited during startup with code $($appProcess.ExitCode)"
              }
              $listener = Get-NetTCPConnection -LocalAddress "127.0.0.1" `
                -LocalPort 43110 -State Listen -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }
            if (-not $listener) {
              throw "Bundled control service did not start"
            }
            $serviceProcess = Get-Process -Id $listener.OwningProcess -ErrorAction Stop
            if ($serviceProcess.ProcessName -ne "strix-console-service") {
              throw "Unexpected process owns the control-service port"
            }
          } finally {
            Get-Process -Name "strix-console", "Strix Console", "strix-console-service" `
              -ErrorAction SilentlyContinue |
              Stop-Process -Force
            $uninstaller = $executables |
              Where-Object Name -Match "uninstall.*\.exe" |
              Select-Object -First 1
            if ($uninstaller) {
              Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait
            }
          }

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            console/src-tauri/target/release/bundle/nsis/*.exe
            console/src-tauri/target/release/bundle/nsis/*.sig
            console/src-tauri/target/release/bundle/nsis/latest.json
            console/src-tauri/target/release/bundle/nsis/sandbox.json
            console/src-tauri/target/release/bundle/nsis/strix-sandbox-*-amd64.tar.gz
            console/src-tauri/target/release/bundle/nsis/install-sandbox-offline.ps1

      - name: Upload release candidate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: strix-console-release-candidate
          path: |
            console/src-tauri/target/release/bundle/nsis/*.exe
            console/src-tauri/target/release/bundle/nsis/*.sig
            console/src-tauri/target/release/bundle/nsis/latest.json
            console/src-tauri/target/release/bundle/nsis/sandbox.json
            console/src-tauri/target/release/bundle/nsis/strix-sandbox-*-amd64.tar.gz
            console/src-tauri/target/release/bundle/nsis/install-sandbox-offline.ps1
          if-no-files-found: error
